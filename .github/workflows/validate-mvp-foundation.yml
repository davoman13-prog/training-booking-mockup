name: Validate MVP foundation

on:
  push:
    branches:
      - main
      - feature/azure-mvp-foundation
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  api:
    name: Type-check and build Azure Functions API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: npm install

      - name: Type-check API
        run: npm run typecheck

      - name: Build API
        run: npm run build
